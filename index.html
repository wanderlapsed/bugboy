<!DOCTYPE html>
<html>
<head>
<style>

.bio-container {
  font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
  max-width: 400px;
  margin: 0 auto;
  padding: 40px 20px;
  text-align: center;
}
body {
  background-color: #68A4BA;
}
.profile-pic {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  margin-bottom: 15px;
  border: 3px solid #e5e7eb;
}
h1 {
  font-size: 1.25rem;
  margin: 0 0 5px;
  color: #1f2937;
}
p {
  color: #6b7280;
  margin: 0 0 30px;
}
.links-list {
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.bio-link {
  display: block;
  padding: 14px;
  background: #fff;
  color: #1f2937;
  text-decoration: none;
  border: 1px solid #d1d5db;
  border-radius: 50px;
  font-weight: 600;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}
.bio-link:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  border-color: #1f2937;
}
</style>
<div class="bio-container">
  <img src="https://images.adagio.com/images2/custom_blends/176792.jpg" alt="Profile" class="profile-pic">
  <h1>Ted Nivison</h1>
  <p>(aka <a href="https://www.youtube.com/watch?v=-3GwCKdfbNI">bugboy</a>)</p>
  <div class="links-list">
    <a href="https://www.youtube.com/@TedNivison" class="bio-link">YouTube</a>
    <a href="https://www.instagram.com/tednivison/" class="bio-link">Instagram</a>
    <a href="https://www.tiktok.com/@tednivison" class="bio-link">TikTok</a>
    <a href="https://x.com/TedNivison" class="bio-link">Twitter / X</a>
	<a href="https://www.instagram.com/ted.jpg/" class="bio-link">Favorite Puppy</a>
  </div>
</div>
</head>
</html>
